# SO-101 booth settings. Edit with:  nano ~/booth/booth.conf

# The recordings, in the order they play, each with the pause after it in seconds.
STEPS="f1_build1:5 f2_build1:30 f2_unbuild1:5 f1_unbuild1:90"

# Calibration id of the white arm (the file calibration/robots/so_follower/white_arm.json).
ROBOT_ID="white_arm"

# Serial port of the white arm. "auto" picks the first USB serial device that is not an Arduino.
PORT="auto"
